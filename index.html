<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Language Games · 语言游戏</title>
<style>
  :root {
    --navy: #1a3c6e;
    --navy-dark: #0b2445;
    --blue: #2060a0;
    --red: #c9211e;
    --grey: #555555;
    --bg: #f4f6fb;
    --card-bg: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #1a1a1a;
    min-height: 100vh;
  }
  .zh { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", "WenQuanYi Zen Hei", sans-serif; }

  #app {
    max-width: 760px;
    margin: 0 auto;
    padding: 48px 16px 60px;
    text-align: center;
  }
  header h1 { color: var(--navy); font-size: 2rem; margin: 0 0 6px; }
  header p { color: var(--grey); margin: 0; font-size: 1.05rem; }

  .hub {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
    margin-top: 40px;
  }
  .hub-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 170px;
    padding: 24px 20px;
    background: var(--card-bg);
    border: 3px solid #e2e6ef;
    border-radius: 18px;
    color: var(--navy-dark);
    text-decoration: none;
    font-size: 1.5rem;
    font-weight: 800;
    line-height: 1.3;
    transition: transform .12s ease, border-color .12s ease, box-shadow .12s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .hub-btn:hover, .hub-btn:focus-visible {
    border-color: var(--navy);
    transform: translateY(-3px);
    box-shadow: 0 8px 22px rgba(26,60,110,0.18);
    outline: none;
  }
  .hub-btn:active { transform: scale(0.98); }
  .hub-btn .icon { font-size: 2.6rem; }
  .hub-btn .sub { font-size: .9rem; font-weight: 500; color: var(--grey); }
  .hub-btn.shannon { border-top-color: var(--red); }
  .hub-btn.ason    { border-top-color: var(--blue); }

  footer { margin-top: 48px; color: #b5bac6; font-size: .8rem; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Language Games</h1>
    <p class="zh">语言游戏 — 选择你的游戏</p>
  </header>

  <main class="hub">
    <a class="hub-btn shannon" href="shannon.html">
      <span class="icon zh" aria-hidden="true">汉</span>
      <span>Shannon: Learn <span class="zh">普通话</span> Chinese</span>
      <span class="sub">Build characters &middot; pinyin &middot; tones</span>
    </a>

    <a class="hub-btn ason" href="ason.html">
      <span class="icon" aria-hidden="true">Aa</span>
      <span>Ason: <span class="zh">学习英语</span></span>
      <span class="sub zh">猜词游戏 — 动词与简单时态</span>
    </a>
  </main>

  <footer>Words are generated live by AI via Cloudflare Workers</footer>
</div>
</body>
</html>
